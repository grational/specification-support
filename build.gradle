plugins {
	id 'groovy'
	id 'java-library'
	id 'maven-publish'
	id 'pl.allegro.tech.build.axion-release' version '1.21.1'
}

def targetJava = 8
def groovyVersion = '3.0.25'
def spockVersion = '2.4-groovy-3.0'

group = 'com.github.grational'
version = scmVersion.version

java {
	toolchain.languageVersion = JavaLanguageVersion.of(targetJava)
}

repositories {
	mavenCentral()
}

dependencies {
	def groovyGroup = groovyVersion.startsWith('3.') ? 'org.codehaus.groovy' : 'org.apache.groovy'
	api "${groovyGroup}:groovy:${groovyVersion}"
	api 'com.github.tomakehurst:wiremock-jre8:2.35.2'

	testImplementation "org.spockframework:spock-core:$spockVersion"
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	if (targetJava >= 9) jvmArgs '--add-opens=java.base/java.util=ALL-UNNAMED'
}

[uniTest: 'USpec', intTest: 'ISpec', funTest: 'FSpec'].each { name, suffix ->
	tasks.register(name, Test) {
		testClassesDirs = sourceSets.test.output.classesDirs
		classpath = sourceSets.test.runtimeClasspath
		include "**/*${suffix}.class"
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) { from components.java }
	}
}
